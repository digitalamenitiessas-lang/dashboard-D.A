# Configuracion de pnpm.


# --- Que paquetes pueden correr sus scripts de instalacion -----------------
#
# pnpm los bloquea a todos por defecto, porque un postinstall es codigo
# arbitrario de un tercero corriendo en tu maquina y en el servidor de build.
# Cuando aparece uno nuevo pnpm lo anota aca con "set this to true or false" y
# corta el install con error hasta que alguien conteste. Estaban sin contestar,
# asi que `pnpm install` terminaba en error 1.
allowBuilds:
  # Next lo usa para optimizar imagenes, y su script baja el binario nativo de
  # la plataforma. Sin esto no sirve.
  sharp: true

  # Lo arrastra la CLI de shadcn, que es scaffolding: nada del dashboard lo usa
  # en runtime. Su postinstall copia un service worker dentro de public/, y el
  # nuestro —public/sw.js, el de las push— ya esta ahi.
  msw: false

  # Su postinstall solo imprime un pedido de donacion.
  core-js: false


# --- Versiones forzadas -----------------------------------------------------
#
# hono estaba fijado en el campo "pnpm" de package.json. Vercel corre pnpm 10,
# que SI lee ese campo, mientras que el pnpm 11 de nuestras maquinas lo ignora
# por completo. Esa asimetria fue la que rompio el deploy: en local no habia
# overrides que contrastar contra el lockfile y el install pasaba limpio, y en
# el build la config decia una cosa y el lockfile otra.
#
# Aca lo leen las dos versiones por igual, y el lockfile quedo regenerado para
# que la seccion "overrides" que ahora tiene coincida con esto.
overrides:
  hono: 4.12.25
